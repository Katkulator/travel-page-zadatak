<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Homepage</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@700&display=swap"
      rel="stylesheet"
  />

  <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
  />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
<header class="hero">
  <div class="hero__overlay"></div>

  <div class="hero__topbar">
    <div class="container">
      <nav class="nav">
        <a href="#" class="logo" aria-label="Travel home">
          <img src="assets/logo.svg" alt="Travel" class="logo__image">
        </a>

        <button
            class="nav__toggle"
            type="button"
            aria-label="Open navigation"
            aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <ul class="nav__list">
          <li><a href="#home">HOME</a></li>
          <li><a href="#promotion">ABOUT</a></li>
          <li><a href="#offers">SERVICES</a></li>
          <li><a href="#destinations">PACKAGES</a></li>
        </ul>
      </nav>
    </div>
  </div>

  <div class="swiper hero-swiper" id="home">
    <div class="swiper-wrapper">
      <div class="swiper-slide hero-slide hero-slide--1"></div>
      <div class="swiper-slide hero-slide hero-slide--2"></div>
      <div class="swiper-slide hero-slide hero-slide--3"></div>
    </div>

    <div class="container hero__content">
      <p class="hero__eyebrow animate-on-load delay-1">
        YOUR ULTIMATE TRAVEL PARTNER
      </p>
      <h1 class="hero__title animate-on-load delay-2">
        Explore the World, Unwrap the Adventure
      </h1>
    </div>

    <div class="hero-swiper__pagination swiper-pagination"></div>
  </div>
</header>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
